# cashp - test stack (AI / automated testing)
# Copy to a temp directory before running so ./volumes/ never resolves to the project tree

name: cashp-test

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  cashp:
    image: ghcr.io/webappsgo/cashp:devel
    container_name: cashp-test
    hostname: cashp
    restart: "no"
    pull_policy: always
    logging: *default-logging
    environment:
      DEBUG: true
      MODE: development
      PORT: 80
      TZ: ${TZ:-America/New_York}
      CACHE_URL: valkey://cashp-cache-test:6379
    volumes:
      # CRITICAL: ./volumes/ must resolve to $TEMP_DIR/volumes/, NOT the project directory
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "172.17.0.1:64581:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/cashp", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      cashp-cache-test:
        condition: service_healthy
    networks:
      - cashp-test

  cashp-cache-test:
    image: valkey/valkey:alpine
    container_name: cashp-cache-test
    restart: "no"
    logging: *default-logging
    tmpfs:
      # ephemeral — always clean state
      - /data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cashp-test

networks:
  cashp-test:
    driver: bridge
    # explicit name for reliable cleanup
    name: cashp-test
